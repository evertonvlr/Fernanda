<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Você ❤️</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #fce4ec;
            margin: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        .container {
            position: relative;
        }

        .envelope-wrapper {
            background: #f4f4f4;
            height: 200px;
            width: 300px;
            position: relative;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .envelope-wrapper:hover {
            transform: scale(1.02);
        }

        /* Parte de dentro do envelope */
        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            z-index: 2;
            border-top: 100px solid #ff8ba7; /* Cor da aba superior */
            border-right: 150px solid transparent;
            border-left: 150px solid transparent;
            transform-origin: top;
            transition: all 0.5s ease-in-out 0.7s;
        }

        .envelope::after {
            content: '';
            position: absolute;
            z-index: 2;
            width: 0;
            height: 0;
            border-top: 100px solid transparent;
            border-right: 150px solid #ffc6d9; /* Cor das abas laterais */
            border-bottom: 100px solid #ffc6d9;
            border-left: 150px solid #ffc6d9;
        }

        /* A Cartinha */
        .letter {
            position: absolute;
            right: 20%;
            bottom: 0;
            width: 60%;
            height: 80%;
            background: white;
            text-align: center;
            transition: all 1s ease-in-out;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
            padding: 20px 10px;
            box-sizing: border-box;
            z-index
